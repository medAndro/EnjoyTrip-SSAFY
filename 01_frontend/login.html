<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      로그인 | EnjoyTrip
    </title>
    <link rel="icon" href="./assets/icons/pin.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/members.css">
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">
      본문으로 이동
    </a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html">
          <img src="./assets/icons/pin.svg" alt="">
          EnjoyTrip
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
          <ul>
            <li>
              <a href="./attractions.html">
                여행지 탐색
              </a>
            </li>
            <li>
              <a href="./plans.html">
                여행 계획
              </a>
            </li>
            <li>
              <a href="./hotplaces.html">
                Hotplace
              </a>
            </li>
          </ul>
        </nav>
        <div class="account-links">
          <a data-auth-link href="./login.html">
            로그인
          </a>
          <a data-auth-link href="./signup.html">
            회원가입
          </a>
          <a href="./mypage.html">
            내 정보
          </a>
          <span data-session-user hidden>
          </span>
          <button type="button" data-logout hidden>
            로그아웃
          </button>
        </div>
      </div>
    </header>
<main id="main" class="container">
      <div class="page-heading">
        <span class="eyebrow">
          WELCOME BACK
        </span>
        <h1>
          다시 만나서 반가워요
        </h1>
        <p class="muted">
          로그인하고 준비해 둔 여행을 이어가세요.
        </p>
      </div>
      <div class="auth-layout">
        <aside class="auth-story">
          <img src="./assets/images/travel-landscape.svg" alt="여행 일러스트">
          <p class="hint">
            샘플 계정을 가입한 뒤 사용할 학습용 로그인 화면입니다.
          </p>
        </aside>
        <div class="stack">
          <section class="panel shadow-sm" aria-labelledby="login-title">
            <h2 id="login-title">
              로그인
            </h2>
            <form id="login-form" class="member-form">
              <div class="field">
                <label for="user-id">
                  아이디
                </label>
                <input class="form-control" id="user-id" name="user-id" type="text" required autocomplete="username">
              </div>
              <div class="field">
                <label for="password">
                  데모 비밀번호
                </label>
                <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
              </div>
              <p class="hint" role="status" aria-live="polite">
              </p>
              <button type="submit">
                로그인
              </button>
              <div class="row">
                <a class="hint" href="./signup.html">
                  회원가입
                </a>
                <a class="hint" href="#recover">
                  비밀번호 찾기
                </a>
              </div>
            </form>
          </section>
          <section id="recover" class="panel shadow-sm" aria-labelledby="recover-title">
            <h2 id="recover-title">
              데모 비밀번호 재설정
            </h2>
            <p class="hint">
              실제 이메일을 발송하지 않는 학습용 흐름입니다.
            </p>
            <form id="recover-form" class="member-form">
              <div class="field">
                <label for="recover-id">
                  아이디
                </label>
                <input class="form-control" id="recover-id" name="recover-id" type="text" required>
              </div>
              <div class="field">
                <label for="recover-email">
                  가입한 샘플 이메일
                </label>
                <input class="form-control" id="recover-email" name="recover-email" type="email" required>
              </div>
              <div class="field">
                <label for="new-password">
                  새 데모 비밀번호
                </label>
                <input class="form-control" id="new-password" name="new-password" type="password" required minlength="8" autocomplete="new-password">
              </div>
              <div class="field">
                <label for="new-password-confirm">
                  새 데모 비밀번호 확인
                </label>
                <input class="form-control" id="new-password-confirm" name="new-password-confirm" type="password" required minlength="8" autocomplete="new-password">
              </div>
              <p class="hint" role="status" aria-live="polite">
              </p>
              <button type="submit" class="secondary">
                재설정하기
              </button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container row">
        <p>
          EnjoyTrip · 우리 손으로 만드는 여행
        </p>
        <p>
          관광 정보: 한국관광공사 · 회원·일정: 브라우저 Storage
        </p>
      </div>
    </footer>
<script type="module" src="./js/common.js">
    </script>
    <script type="module" src="./js/members.js">
    </script>
  </body>
</html>
