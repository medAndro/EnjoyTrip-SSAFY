<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      회원가입 | EnjoyTrip
    </title>
    <link rel="icon" href="./assets/icons/pin.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/members.css">
  </head>
  <body data-page="signup">
    <a class="skip-link" href="#main">
      본문으로 이동
    </a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html">
          <img src="./assets/icons/pin.svg" alt="">
          EnjoyTrip
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
          <ul>
            <li>
              <a href="./attractions.html">
                여행지 탐색
              </a>
            </li>
            <li>
              <a href="./plans.html">
                여행 계획
              </a>
            </li>
            <li>
              <a href="./hotplaces.html">
                Hotplace
              </a>
            </li>
          </ul>
        </nav>
        <div class="account-links">
          <a data-auth-link href="./login.html">
            로그인
          </a>
          <a data-auth-link href="./signup.html">
            회원가입
          </a>
          <a href="./mypage.html">
            내 정보
          </a>
          <span data-session-user hidden>
          </span>
          <button type="button" data-logout hidden>
            로그아웃
          </button>
        </div>
      </div>
    </header>
<main id="main" class="container">
      <div class="page-heading">
        <span class="eyebrow">
          JOIN US
        </span>
        <h1>
          함께 여행을 시작해요
        </h1>
        <p class="muted">
          나만의 여행 계획과 장소 기록을 준비하세요.
        </p>
      </div>
      <div class="auth-layout">
        <aside class="auth-story">
          <h2>
            발견한 장소를
            <br>
            나의 여행으로.
          </h2>
          <p class="muted">
            계정을 만들면 여행 일정과 방문 기록을 관리할 수 있어요.
          </p>
          <img src="./assets/images/travel-landscape.svg" alt="산과 산책길 일러스트">
          <p class="hint">
            학습용 회원 기능입니다. 가상의 이메일과 데모 비밀번호를 사용하세요.
          </p>
        </aside>
        <section class="panel shadow-sm" aria-labelledby="signup-title">
          <h2 id="signup-title">
            회원가입
          </h2>
          <form id="signup-form" class="member-form">
            <div class="field">
              <label for="user-id">
                아이디
              </label>
              <input class="form-control" id="user-id" name="user-id" type="text" required minlength="4" maxlength="20" autocomplete="username" placeholder="4~20자">
            </div>
            <div class="field">
              <label for="nickname">
                닉네임
              </label>
              <input class="form-control" id="nickname" name="nickname" type="text" required maxlength="20" autocomplete="nickname">
            </div>
            <div class="field">
              <label for="email">
                샘플 이메일
              </label>
              <input class="form-control" id="email" name="email" type="email" required autocomplete="email" placeholder="demo@example.com">
            </div>
            <div class="field">
              <label for="password">
                데모 비밀번호
              </label>
              <input class="form-control" id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="field">
              <label for="password-confirm">
                데모 비밀번호 확인
              </label>
              <input class="form-control" id="password-confirm" name="password-confirm" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <label class="checkbox-label" for="demo-consent">
              <input class="form-control" id="demo-consent" name="demo-consent" type="checkbox" required>
              학습용 가상 정보를 사용합니다.
            </label>
            <p class="hint" role="status" aria-live="polite">
            </p>
            <button type="submit">
              가입하기
            </button>
            <a class="hint" href="./login.html">
              이미 계정이 있나요? 로그인
            </a>
          </form>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container row">
        <p>
          EnjoyTrip · 우리 손으로 만드는 여행
        </p>
        <p>
          관광 정보: 한국관광공사 · 회원·일정: 브라우저 Storage
        </p>
      </div>
    </footer>
<script type="module" src="./js/common.js">
    </script>
    <script type="module" src="./js/members.js">
    </script>
  </body>
</html>
