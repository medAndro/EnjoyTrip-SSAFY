<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      내 정보 | EnjoyTrip
    </title>
    <link rel="icon" href="./assets/icons/pin.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/members.css">
  </head>
  <body data-page="mypage">
    <a class="skip-link" href="#main">
      본문으로 이동
    </a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./index.html">
          <img src="./assets/icons/pin.svg" alt="">
          EnjoyTrip
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
          <ul>
            <li>
              <a href="./attractions.html">
                여행지 탐색
              </a>
            </li>
            <li>
              <a href="./plans.html">
                여행 계획
              </a>
            </li>
            <li>
              <a href="./hotplaces.html">
                Hotplace
              </a>
            </li>
          </ul>
        </nav>
        <div class="account-links">
          <a data-auth-link href="./login.html">
            로그인
          </a>
          <a data-auth-link href="./signup.html">
            회원가입
          </a>
          <a href="./mypage.html">
            내 정보
          </a>
          <span data-session-user hidden>
          </span>
          <button type="button" data-logout hidden>
            로그아웃
          </button>
        </div>
      </div>
    </header>
    <div class="preview-notice">
      <div class="container">
        화면 레퍼런스 · 검색, 저장, 로그인, 지도 기능 연결 전
      </div>
    </div>
    <main id="main" class="container">
      <div class="page-heading">
        <span class="eyebrow">
          MY ACCOUNT
        </span>
        <h1>
          나의 여행 프로필
        </h1>
        <p class="muted">
          회원 정보를 확인하고 수정하는 공간입니다.
        </p>
      </div>
      <div class="profile-layout">
        <aside class="panel profile-summary">
          <div class="avatar" aria-hidden="true">
            旅
          </div>
          <h2 id="profile-nickname">
            여행자 샘플
          </h2>
          <p id="profile-id" class="muted">
            프로필 배치 예시
          </p>
          <div class="stack">
            <a class="button secondary" href="./plans.html">
              내 여행 계획
            </a>
            <a class="button secondary" href="./hotplaces.html">
              내 Hotplace
            </a>
          </div>
        </aside>
        <section class="panel" aria-labelledby="profile-title">
          <h2 id="profile-title">
            회원 정보
          </h2>
          <form id="profile-form" class="member-form" data-preview-form>
            <div class="field">
              <label for="user-id">
                아이디
              </label>
              <input id="user-id" name="user-id" type="text" readonly value="sample-user">
            </div>
            <div class="field">
              <label for="nickname">
                닉네임
              </label>
              <input id="nickname" name="nickname" type="text" required maxlength="20" value="여행자 샘플">
            </div>
            <div class="field">
              <label for="email">
                샘플 이메일
              </label>
              <input id="email" name="email" type="email" required value="demo@example.com">
            </div>
            <p class="hint" role="status" aria-live="polite">
            </p>
            <div class="actions">
              <button type="submit">
                변경사항 저장
              </button>
              <button type="button" id="withdraw" class="secondary" disabled>
                회원 탈퇴
              </button>
            </div>
            <p class="hint">
              로그인 회원을 불러오기 전의 화면 예시입니다.
            </p>
          </form>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container row">
        <p>
          EnjoyTrip · 우리 손으로 만드는 여행
        </p>
        <p>
          일러스트와 데이터는 학습용 샘플입니다.
        </p>
      </div>
    </footer>
    <script type="module" src="./js/preview.js">
    </script>
    <script type="module" src="./js/common.js">
    </script>
    <script type="module" src="./js/members.js">
    </script>
  </body>
</html>
